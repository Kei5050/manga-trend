name: Weekly Trend Collection

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python scripts/collect.py

      - name: Analyze
        run: python scripts/analyze.py

      - name: Report
        run: python scripts/report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trend.db docs/index.html
          git diff --staged --quiet || git commit -m "chore: weekly trend update $(date -u +%Y-%m-%d)"
          git push
